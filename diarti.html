<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diarti Dent | Klinika Dentare Premium në Prishtinë</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #16b8a6;
            --primary-dark: #087f82;
            --coral: #ff7b72;
            --gold: #ffc857;
            --dark: #123b4a;
            --text: #55717b;
            --light: #f3fbfb;
            --white: #ffffff;
            --shadow: 0 18px 45px rgba(18, 59, 74, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            line-height: 1.7;
            background-color: var(--light);
        }
        h1, h2, h3 { font-family: 'Playfair Display', serif; color: var(--dark); font-weight: 700; line-height: 1.15; }
        
        /* Navigation */
        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 6%;
            background: transparent;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }
        .logo img { display: block; width: min(220px, 70vw); height: auto; filter: drop-shadow(0 3px 8px rgba(0,0,0,0.28)); }
        /* Hero Section */
        .hero {
            min-height: 100vh;
            background: linear-gradient(115deg, rgba(7, 76, 91, 0.92), rgba(20, 184, 166, 0.48)), url('https://images.unsplash.com/photo-1629909613654-28e377c37b09?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 220px 20px 60px;
            position: relative;
            overflow: hidden;
        }
        .hero::after {
            content: '';
            position: absolute;
            width: 360px;
            height: 360px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            right: -100px;
            bottom: -150px;
        }
        .hero-content { max-width: 760px; position: relative; z-index: 1; }
        .hero-content h1 { color: white; font-size: clamp(2.8rem, 6vw, 5rem); margin-bottom: 24px; text-shadow: 0 4px 20px rgba(0,0,0,0.14); }
        .hero-content p { font-size: 1.15rem; font-weight: 400; max-width: 620px; margin: 0 auto 34px; color: rgba(255,255,255,0.9); }
        .hero-circles { display: flex; justify-content: center; flex-wrap: wrap; gap: 34px; margin: 0 auto 34px; }
        .hero-circle {
            width: 164px;
            height: 164px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            border: 1px solid rgba(245, 231, 205, 0.88);
            border-radius: 50%;
            background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(235, 226, 207, 0.94));
            color: var(--dark);
            text-decoration: none;
            box-shadow: inset 0 0 0 6px rgba(255,255,255,0.48), 0 14px 30px rgba(5, 37, 45, 0.24);
            transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
        }
        .hero-circle:hover { transform: translateY(-7px); background: linear-gradient(145deg, #fff, #f3ead8); box-shadow: inset 0 0 0 6px rgba(255,255,255,0.62), 0 19px 36px rgba(5, 37, 45, 0.3); }
        .hero-circle strong { font-family: 'Playfair Display', serif; font-size: 1.18rem; line-height: 1.2; }
        .hero-circle span { margin-top: 8px; font-size: 12px; line-height: 1.35; color: #64736e; }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--coral), #ff9a62);
            color: white;
            text-decoration: none;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 10px 24px rgba(255, 123, 114, 0.35);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(255, 123, 114, 0.45); }

        @media (max-width: 768px) {
            .hero { padding-top: 180px; }
            .hero-circles { gap: 16px; margin-bottom: 24px; }
            .hero-circle { width: clamp(112px, 32vw, 138px); height: clamp(112px, 32vw, 138px); padding: 12px; }
            .hero-circle strong { font-size: 1rem; }
            .hero-circle span { font-size: 10px; }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <a href="#" class="logo" aria-label="Diarti Dent - faqja kryesore"><img src="diarti-navigation.png" alt="Diarti Dent"></a>
    </nav>

    <!-- Hero -->
    <header class="hero">
        <div class="hero-content">
            <h1>Buzëqeshja që meriton</h1>
            <p>Kujdes dentar premium në zemër të Prishtinës. Përvojë mbi 24 vjeçare, teknologji moderne dhe estetikë e përsosur.</p>
            <div class="hero-circles" aria-label="Eksploro Diarti Dent">
                <a class="hero-circle" href="rreth-nesh.html"><strong>Rreth Nesh</strong><span>Njih ekipin tonë</span></a>
                <a class="hero-circle" href="sherbimet.html"><strong>Shërbimet</strong><span>Kujdes për buzëqeshjen</span></a>
                <a class="hero-circle" href="kontakt.html"><strong>Kontakt</strong><span>Lokacioni dhe orari</span></a>
            </div>
            <a href="rezervo-termin.html" class="btn">Rezervo Termin</a>
        </div>
    </header>

</body>
</html>
